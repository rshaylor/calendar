name: Family Hub
version: "0.2.1"
slug: family_hub
description: A Skylight-style family hub — shared calendar, chores with star rewards, and lists, on a kitchen touchscreen and family phones.
url: https://github.com/rshaylor/calendar
arch:
  - aarch64
  - amd64

# A long-running web service.
init: false
startup: application
boot: auto

# Expose the UI through HA's Ingress (auth-protected by HA).
ingress: true
ingress_port: 8000
panel_icon: mdi:home-heart
panel_title: Family Hub
# Anyone in the household with HA access can use it (not admin-only).
panel_admin: false

# Direct host port for the Google OAuth callback URL (must be a stable
# URL Google can redirect to). Family members reach the app via Ingress;
# only the OAuth handshake uses this port.
ports:
  "8000/tcp": 8000
ports_description:
  "8000/tcp": Google Calendar OAuth callback

# Persistent SQLite at /data/app.db survives restarts and updates.
# AppArmor profile is currently disabled — the previous profile blocked
# s6-overlay's /init from re-executing on restart. Revisit once we have
# a profile that's been tested through a full stop/start cycle.
apparmor: false

# Add-on configuration form rendered in the HA UI.
options:
  google_client_id: ""
  google_client_secret: ""
  google_redirect_uri: "http://homeassistant.local:8000/api/calendar/callback"
  location_lat: ""
  location_lon: ""
  calendar_sync_seconds: 1800
schema:
  google_client_id: str
  google_client_secret: password
  google_redirect_uri: str
  location_lat: str?
  location_lon: str?
  calendar_sync_seconds: int(60,)

# We don't need any HA APIs at runtime.
hassio_api: false
homeassistant_api: false
host_network: false
