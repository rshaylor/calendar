name: Family Hub
version: "0.1.0"
slug: family_hub
description: Calendar, chores, rewards, and lists for the family on a kitchen touchscreen.
url: https://github.com/rshaylor/calendar
arch:
  - aarch64
  - amd64

# Persistent SQLite database lives in /data, automatically mounted by HA.
# Web UI is served on port 8000 inside the container.
init: false

# Expose the UI under HA's sidebar via Ingress (auth-protected).
ingress: true
ingress_port: 8000
panel_icon: mdi:home-heart
panel_title: Family Hub

# Direct host port for the Google OAuth callback URL (must be a stable
# URL so Google can redirect to it). Family members reach the app via
# Ingress; only the OAuth handshake uses this port.
ports:
  "8000/tcp": 8000
ports_description:
  "8000/tcp": OAuth callback for Google Calendar (also direct UI access)

# Add-on configuration form rendered in the HA UI.
options:
  google_client_id: ""
  google_client_secret: ""
  google_redirect_uri: "http://homeassistant.local:8000/api/calendar/callback"
  location_lat: ""
  location_lon: ""
  calendar_sync_seconds: 1800
schema:
  google_client_id: str
  google_client_secret: password
  google_redirect_uri: str
  location_lat: str?
  location_lon: str?
  calendar_sync_seconds: int(60,)

boot: auto
hassio_api: false
host_network: false
