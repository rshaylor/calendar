name: Family Hub
version: "0.3.0"
slug: family_hub
description: Skylight-style family hub — shared calendar, chores with star rewards, lists. Reads calendars from any Home Assistant calendar integration (Google, Office 365, Local Calendar, CalDAV).
url: https://github.com/rshaylor/calendar
arch:
  - aarch64
  - amd64

# A long-running web service.
init: false
startup: application
boot: auto

# Expose the UI through HA's Ingress (auth-protected by HA).
ingress: true
ingress_port: 8000
panel_icon: mdi:home-heart
panel_title: Family Hub
# Anyone in the household with HA access can use it (not admin-only).
panel_admin: false

# Persistent SQLite at /data/app.db survives restarts and updates.
# AppArmor profile is currently disabled — the previous profile blocked
# s6-overlay's /init from re-executing on restart. Revisit once we have
# a profile that's been tested through a full stop/start cycle.
apparmor: false

# We talk to HA Core's REST + WebSocket API to read/write calendars.
# This injects SUPERVISOR_TOKEN into the container; no extra config needed.
homeassistant_api: true
hassio_api: false
host_network: false

# Add-on configuration form rendered in the HA UI.
# Calendar setup happens in HA itself — no Google credentials live here any more.
options:
  location_lat: ""
  location_lon: ""
schema:
  location_lat: str?
  location_lon: str?
